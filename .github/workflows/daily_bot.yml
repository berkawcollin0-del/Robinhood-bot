name: Housing News Bot

on:
  schedule:
    # 0 minutes, 14 hours (9:00 AM CDT), every day
    - cron: '0 14 * * *'
  workflow_dispatch: # Allows manual triggering for testing

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser python-telegram-bot

      - name: Run bot
        run: python main.py
        env:
          # Use secrets for security!
          TELEGRAM_TOKEN: 